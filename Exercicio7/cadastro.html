<div class="container mt-5">


<h1 class="text-center">
Cadastro de Produto
</h1>



<form id="formProduto" class="mt-4">



<div class="mb-3">

<label class="form-label">
Nome do produto
</label>

<input 
type="text" 
id="nome"
class="form-control"
placeholder="Digite o nome">

</div>




<div class="mb-3">

<label class="form-label">
Categoria
</label>

<input 
type="text"
id="categoria"
class="form-control"
placeholder="Digite a categoria">

</div>





<div class="mb-3">

<label class="form-label">
Preço
</label>

<input 
type="number"
id="preco"
class="form-control"
placeholder="Digite o preço">

</div>





<div class="mb-3">

<label class="form-label">
Estoque
</label>

<input 
type="number"
id="estoque"
class="form-control"
placeholder="Quantidade">

</div>





<div class="mb-3">

<label class="form-label">
Status
</label>


<select id="status" class="form-control">


<option value="Disponível">
Disponível
</option>


<option value="Indisponível">
Indisponível
</option>


</select>

</div>




<button type="submit" class="btn btn-success">

Cadastrar Produto

</button>



</form>



<div id="mensagem" class="mt-3"></div>



</div>
