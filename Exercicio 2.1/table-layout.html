<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout com Tabela</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            border: 1px solid #ccc;
            padding: 15px;
        }

        .header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
        }

        .nav {
            background-color: #f2f2f2;
            text-align: center;
        }

        .footer {
            background-color: #ddd;
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <td colspan="2" class="header">
            <h1>Viagens pelo Brasil</h1>
        </td>
    </tr>

    <tr>
        <td colspan="2" class="nav">
            <a href="#">Início</a> |
            <a href="#">Destinos</a> |
            <a href="#">Contato</a>
        </td>
    </tr>

    <tr>
        <td>
            <h2>Conteúdo</h2>
            <p>Esta página utiliza tabelas para organizar o layout, uma técnica antiga utilizada antes do CSS moderno.</p>
        </td>

        <td>
            <h2>Informações</h2>
            <p>Hoje o recomendado é utilizar HTML semântico e CSS para criar layouts.</p>
        </td>
    </tr>

    <tr>
        <td colspan="2" class="footer">
            &copy; 2026 - Exemplo de Table-Based Layout
        </td>
    </tr>
</table>

</body>
</html>
